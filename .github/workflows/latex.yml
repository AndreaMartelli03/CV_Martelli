name: Build LaTeX CV and Deploy PDF

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX environment
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-full make

      - name: Compile CV using Makefile
        run: make

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          destination_dir: .
          force_orphan: true
          keep_files: false
          cname: ""
          commit_message: "Deploy compiled CV PDF"
